<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevGuard — Static & Generative Code Auditor</title>
  <style>
    :root {
      --bg-base: #090c10;
      --bg-surface: #0d1117;
      --bg-subtle: #161b22;
      --border: #30363d;
      --border-focus: #58a6ff;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --primary: #1f6feb;
      --primary-hover: #388bfd;
      --danger: #f85149;
      --warning: #d29922;
      --success: #3fb950;
      --font-code: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    /* Navigation */
    header {
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
      padding: 14px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }
    .brand-subtitle {
      color: var(--text-muted);
      font-size: 12px;
      margin-left: 8px;
      padding-left: 8px;
      border-left: 1px solid var(--border);
    }
    .badge {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    /* Container */
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }

    /* API Configuration */
    .config-strip {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .config-strip label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }
    .config-strip input {
      flex: 1;
      min-width: 280px;
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      color: var(--text-main);
      font-family: var(--font-code);
      font-size: 12px;
    }
    .config-strip input:focus {
      outline: none;
      border-color: var(--border-focus);
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
    }
    .card-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-header h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-muted);
    }
    .card-body {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Editor */
    textarea {
      width: 100%;
      height: 380px;
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      color: var(--text-main);
      font-family: var(--font-code);
      font-size: 13px;
      line-height: 1.6;
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      border-color: var(--border-focus);
    }

    /* Controls */
    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    button {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover {
      background: #21262d;
      border-color: #8b949e;
    }
    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    button.primary:hover {
      background: var(--primary-hover);
    }

    /* Metrics */
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .metric-card {
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
    }
    .metric-value {
      font-size: 20px;
      font-weight: 600;
      font-family: var(--font-code);
    }
    .metric-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* Issues List */
    .findings-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 400px;
      overflow-y: auto;
    }
    .finding-item {
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border);
      border-radius: 4px;
      padding: 12px;
    }
    .finding-item.high { border-left-color: var(--danger); }
    .finding-item.medium { border-left-color: var(--warning); }
    .finding-item.low { border-left-color: var(--success); }

    .finding-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .finding-title {
      font-weight: 600;
      font-size: 13px;
    }
    .tag-severity {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: var(--font-code);
    }
    .tag-severity.high { background: rgba(248,81,73,0.15); color: var(--danger); }
    .tag-severity.medium { background: rgba(210,153,34,0.15); color: var(--warning); }
    .tag-severity.low { background: rgba(63,185,80,0.15); color: var(--success); }

    .finding-meta {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-code);
      margin-bottom: 6px;
    }
    .finding-code {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 8px;
      font-family: var(--font-code);
      font-size: 12px;
      color: #e6edf3;
      margin: 6px 0;
      overflow-x: auto;
    }
    .finding-desc {
      color: var(--text-muted);
      font-size: 12px;
      margin-bottom: 6px;
    }
    .finding-fix {
      font-size: 12px;
      color: var(--text-main);
      background: rgba(56, 139, 253, 0.08);
      border-radius: 4px;
      padding: 6px 8px;
      border: 1px solid rgba(56, 139, 253, 0.2);
    }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center;">
    <span class="brand-title">DevGuard</span>
    <span class="brand-subtitle">Application Security Audit Engine</span>
  </div>
  <div class="badge" id="engineStatus">Ready</div>
</header>

<main>
  <!-- Authentication Config Strip -->
  <div class="config-strip">
    <label for="apiKey">Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AIzaSy...">
    <button id="saveKey">Store Key</button>
    <span id="keyLabel" style="font-size:12px; color:var(--text-muted);">Stored locally in browser session</span>
  </div>

  <div class="grid">
    <!-- Input Column -->
    <div class="card">
      <div class="card-header">
        <h2>Source Buffer</h2>
        <span class="badge">Python</span>
      </div>
      <div class="card-body">
        <textarea id="code" spellcheck="false" placeholder="# Insert Python code for evaluation..."></textarea>
        
        <div class="button-group">
          <button id="demoBtn">Load Benchmark</button>
          <button id="clearBtn">Clear</button>
        </div>

        <div class="button-group" style="margin-top: 14px;">
          <button id="scanBtn" style="flex: 1;">Run Rule Scan</button>
          <button id="aiScanBtn" class="primary" style="flex: 1;">Run AI Deep Audit</button>
        </div>
      </div>
    </div>

    <!-- Findings Column -->
    <div class="card">
      <div class="card-header">
        <h2>Audit Results</h2>
        <button id="exportBtn" style="padding: 3px 8px; font-size: 11px;">Export JSON</button>
      </div>
      <div class="card-body">
        <div class="metrics">
          <div class="metric-card">
            <div class="metric-value" id="countFindings">0</div>
            <div class="metric-label">Findings</div>
          </div>
          <div class="metric-card">
            <div class="metric-value" id="countCritical" style="color:var(--danger)">0</div>
            <div class="metric-label">High Severity</div>
          </div>
          <div class="metric-card">
            <div class="metric-value" id="riskScore">0</div>
            <div class="metric-label">Risk Index</div>
          </div>
        </div>

        <div class="findings-container" id="findingsList">
          <div class="empty-state">No analysis run yet. Paste code and select a scan mode.</div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);

// Storage
window.addEventListener('DOMContentLoaded', () => {
  const stored = localStorage.getItem('devguard_gemini_key');
  if (stored) {
    $('apiKey').value = stored;
    $('keyLabel').textContent = "Key configured";
    $('keyLabel').style.color = "var(--success)";
  }
});

$('saveKey').addEventListener('click', () => {
  const val = $('apiKey').value.trim();
  if (val) {
    localStorage.setItem('devguard_gemini_key', val);
    $('keyLabel').textContent = "Key saved";
    $('keyLabel').style.color = "var(--success)";
  } else {
    localStorage.removeItem('devguard_gemini_key');
    $('keyLabel').textContent = "Key cleared";
    $('keyLabel').style.color = "var(--text-muted)";
  }
});

const benchmarkCode = `import os
import subprocess
import pickle
from flask import Flask, request
import sqlite3

app = Flask(__name__)

JWT_SECRET_KEY = "super_secret_jwt_token_12345678"
AWS_ACCESS_KEY = "AKIAIOSFODNN7EXAMPLE_SECRET_KEY"

@app.route("/user", methods=["GET"])
def get_user():
    user_id = request.args.get("id")
    conn = sqlite3.connect("database.db")
    cursor = conn.cursor()
    query = f"SELECT username, email FROM users WHERE id = '{user_id}'"
    cursor.execute(query)
    return str(cursor.fetchall())

@app.route("/load_session", methods=["POST"])
def load_session():
    cookie_data = request.cookies.get("session")
    session_obj = pickle.loads(cookie_data)
    return f"Welcome {session_obj}"

@app.route("/run_ping", methods=["POST"])
def run_ping():
    ip_addr = request.json.get("ip")
    cmd = "ping -c 1 " + ip_addr
    result = subprocess.run(cmd, shell=True, capture_output=True, text=True)
    return result.stdout

@app.route("/read_log", methods=["GET"])
def read_log():
    filename = request.args.get("file")
    log_path = os.path.join("/var/logs", filename)
    with open(log_path, "r") as f:
        return f.read()

@app.route("/calc", methods=["POST"])
def calculate():
    user_math = request.json.get("expr")
    return str(eval(user_math))

if __name__ == "__main__":
    app.run(host="0.0.0.0", port=5000, debug=True)
`;

let currentFindings = [];

// Improved Heuristic Engine with broad variable support & multi-line query patterns
function runRegexEngine(src) {
  const lines = src.split("\n");
  const issues = [];

  const patterns = [
    {
      id: "CWE-798",
      severity: "HIGH",
      title: "Hardcoded Credential",
      regex: /([a-z0-9_-]*(api[_-]?key|secret|token|password)[a-z0-9_-]*)\s*=\s*["'][^"']{8,}["']/i,
      desc: "Hardcoded cryptographic secret or token detected in source code.",
      fix: "Store credentials in environment variables or a dedicated key store."
    },
    {
      id: "CWE-89",
      severity: "HIGH",
      title: "SQL Injection Vector",
      regex: /(SELECT|INSERT|UPDATE|DELETE).*(f["']|["'].*\+)/i,
      desc: "Dynamic query concatenation enables SQL manipulation.",
      fix: "Use parameterized queries or ORM abstraction."
    },
    {
      id: "CWE-502",
      severity: "HIGH",
      title: "Unsafe Object Deserialization",
      regex: /pickle\.(loads?|Unpickler)\s*\(/,
      desc: "Arbitrary code execution risk from deserializing untrusted binary payload.",
      fix: "Migrate to safe serialization formats such as JSON or Protocol Buffers."
    },
    {
      id: "CWE-78",
      severity: "HIGH",
      title: "Command Injection",
      regex: /subprocess\.(run|Popen|call|check_output)\s*\([^)]*shell\s*=\s*True/,
      desc: "Subprocess execution with shell=True permits command injection breakout.",
      fix: "Pass execution arguments as a tokenized list with shell=False."
    },
    {
      id: "CWE-95",
      severity: "HIGH",
      title: "Dynamic Evaluation Vulnerability",
      regex: /\beval\s*\(/,
      desc: "Direct evaluation of dynamic input strings allows arbitrary code execution.",
      fix: "Use ast.literal_eval for literals or implement an explicit grammar parser."
    },
    {
      id: "CWE-215",
      severity: "MEDIUM",
      title: "Debug Mode Enabled in Framework",
      regex: /run\(.*debug\s*=\s*True.*\)/,
      desc: "Running interactive debuggers in production exposes internal tracebacks and interactive consoles.",
      fix: "Set debug=False or control via explicit environment configuration."
    },
    {
      id: "CWE-22",
      severity: "MEDIUM",
      title: "Potential Path Traversal",
      regex: /open\s*\(.*os\.path\.join\s*\(/,
      desc: "Unchecked path joining may permit directory traversal attacks.",
      fix: "Resolve absolute paths and ensure target paths remain within the intended base directory."
    }
  ];

  lines.forEach((line, index) => {
    patterns.forEach(p => {
      if (p.regex.test(line)) {
        issues.push({
          id: p.id,
          severity: p.severity,
          title: p.title,
          line: index + 1,
          code: line.trim(),
          desc: p.desc,
          fix: p.fix
        });
      }
    });
  });

  return issues;
}

function updateView() {
  const high = currentFindings.filter(f => f.severity === "HIGH").length;
  const medium = currentFindings.filter(f => f.severity === "MEDIUM").length;
  const low = currentFindings.filter(f => f.severity === "LOW").length;
  const score = Math.min(100, (high * 30) + (medium * 15) + (low * 5));

  $('countFindings').textContent = currentFindings.length;
  $('countCritical').textContent = high;
  $('riskScore').textContent = score;

  const container = $('findingsList');
  if (!currentFindings.length) {
    container.innerHTML = '<div class="empty-state">No issues detected for this configuration.</div>';
    return;
  }

  container.innerHTML = currentFindings.map(item => `
    <div class="finding-item ${item.severity.toLowerCase()}">
      <div class="finding-head">
        <span class="finding-title">${escape(item.title)}</span>
        <span class="tag-severity ${item.severity.toLowerCase()}">${escape(item.severity)}</span>
      </div>
      <div class="finding-meta">${escape(item.id)} · Line ${item.line || 'N/A'}</div>
      ${item.code ? `<div class="finding-code">${escape(item.code)}</div>` : ''}
      <div class="finding-desc">${escape(item.desc)}</div>
      <div class="finding-fix">Remediation: ${escape(item.fix)}</div>
    </div>
  `).join('');
}

function escape(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

// Rule Scan Action
$('scanBtn').addEventListener('click', () => {
  const code = $('code').value;
  if (!code.trim()) return;
  $('engineStatus').textContent = "Running Static Analysis";
  currentFindings = runRegexEngine(code);
  updateView();
  $('engineStatus').textContent = "Static Scan Complete";
});

// Gemini Deep Audit Action
$('aiScanBtn').addEventListener('click', async () => {
  const code = $('code').value;
  const key = $('apiKey').value.trim() || localStorage.getItem('devguard_gemini_key');

  if (!code.trim()) {
    alert("Please provide source code first.");
    return;
  }
  if (!key) {
    alert("Please configure a Gemini API key.");
    return;
  }

  $('engineStatus').textContent = "Running Generative Audit";
  $('findingsList').innerHTML = '<div class="empty-state">Querying audit model and correlating AST flaws...</div>';

  const systemInstruction = `You are a static code security auditor. 
Inspect the code for vulnerabilities (CWE, OWASP Top 10, logic bypasses, command injection, path traversal, hardcoded secrets).
Return strictly a valid JSON array of objects without Markdown formatting or fences.
Each object must have these exact keys:
- "id": standard identifier like CWE-89, CWE-78, etc.
- "severity": "HIGH", "MEDIUM", or "LOW"
- "title": standard short vulnerability title
- "line": integer line number (or 0 if broad)
- "code": the vulnerable line or snippet
- "desc": concise flaw explanation
- "fix": concise remediation action`;

  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [
          { role: "user", parts: [{ text: `${systemInstruction}\n\nCode to inspect:\n${code}` }] }
        ],
        generationConfig: { responseMimeType: "application/json" }
      })
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);

    const parsed = JSON.parse(data.candidates[0].content.parts[0].text);
    
    // Combine with static engine findings, de-duplicating by line number where applicable
    const staticIssues = runRegexEngine(code);
    const lineMap = new Set(parsed.map(p => p.line));
    const uniqueStatic = staticIssues.filter(s => !lineMap.has(s.line));

    currentFindings = [...parsed, ...uniqueStatic];
    updateView();
    $('engineStatus').textContent = "Audit Complete";
  } catch (err) {
    $('engineStatus').textContent = "Audit Failed";
    $('findingsList').innerHTML = `<div class="empty-state" style="color:var(--danger)">Error: ${escape(err.message)}</div>`;
  }
});

// Utilities
$('demoBtn').addEventListener('click', () => {$('code').value = benchmarkCode;
});

$('clearBtn').addEventListener('click', () => {$('code').value = '';
  currentFindings = [];
  $('countFindings').textContent = '0';$('countCritical').textContent = '0';
  $('riskScore').textContent = '0';$('findingsList').innerHTML = '<div class="empty-state">Buffer cleared.</div>';
  $('engineStatus').textContent = 'Ready';
});

$('exportBtn').addEventListener('click', () => {
  if (!currentFindings.length) return;
  const blob = new Blob([JSON.stringify({ audit: "DevGuard", findings: currentFindings }, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "audit-report.json";
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
